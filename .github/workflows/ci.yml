name: Identification CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: identification-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Identification regression tests
        run: |
          python -B -m unittest discover -s tests -p "test_identification_integration.py" -v

      - name: Run end-to-end compatibility smoke tests
        run: |
          python -B -m unittest discover -s tests -p "test_pipeline_smoke.py" -v

      - name: Run student task tests
        run: python -B tools/run_student_tests.py
